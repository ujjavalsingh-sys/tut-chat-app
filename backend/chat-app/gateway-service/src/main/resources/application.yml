server:
  port: 8080   # Gateway runs on port 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_HOST:user-service}:8082
          predicates:
            - Path=/api/users/**
        - id: chat-service
          uri: http://${CHAT_SERVICE_HOST:chat-service}:8081
          predicates:
            - Path=/api/conversations/**
        - id: chat-service
          uri: http://${CHAT_SERVICE_HOST:chat-service}:8081
          predicates:
            - Path=/api/messages/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
