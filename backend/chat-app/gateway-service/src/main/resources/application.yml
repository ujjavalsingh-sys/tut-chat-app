server:
  port: 8443   # Gateway runs on port 8443
  ssl:
    key-store: ${KEYSTORE_PATH:../../certs/keystore.p12}
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: localhost

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_HOST:user-service}:8082
          predicates:
            - Path=/api/users/**
        - id: user-service
          uri: http://${USER_SERVICE_HOST:user-service}:8082
          predicates:
            - Path=/api/auth/**
        - id: chat-service
          uri: http://${CHAT_SERVICE_HOST:chat-service}:8081
          predicates:
            - Path=/api/conversations/**
        - id: chat-service
          uri: http://${CHAT_SERVICE_HOST:chat-service}:8081
          predicates:
            - Path=/api/messages/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "https://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
